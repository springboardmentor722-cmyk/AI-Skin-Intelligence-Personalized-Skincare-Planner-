[project]
name = "skinlytics-backend"
version = "0.1.0"
description = "Skinlytics FastAPI modular monolith (docs/ARCHITECTURE.md, ADR-005)"
requires-python = ">=3.11"
dependencies = [
    "aioboto3>=15.5.0",
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "cryptography>=49.0.0",
    "fastapi>=0.139.0",
    "httpx>=0.28.1",
    "kaggle>=2.2.3",
    "motor>=3.7.1",
    "pandas>=3.0.3",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.13.0",
    "python-multipart>=0.0.20",
    "redis>=8.0.1",
    "sqlalchemy[asyncio]>=2.0.51",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.51.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.2.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.20",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's Depends()-as-default is the framework's own dependency-injection
# idiom (database_schemas/skinlytics_identity_betterauth.md), not a real bug here.
ignore = ["B008"]

[tool.mypy]
# Matches the actual .venv interpreter (3.12, PROGRESS.md), not just the 3.11 floor
# `requires-python` sets — numpy's own stubs (pulled in by pandas, added for the
# Kaggle product ingestion pipeline) use a 3.12-only `type` statement mypy can't
# parse under an older target version.
python_version = "3.12"
strict = true
exclude = ["tests/"]

# No py.typed marker/stubs published — untyped third-party, not our code.
[[tool.mypy.overrides]]
module = ["aioboto3.*", "aiobotocore.*", "botocore.*", "boto3.*", "pandas.*", "kaggle.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

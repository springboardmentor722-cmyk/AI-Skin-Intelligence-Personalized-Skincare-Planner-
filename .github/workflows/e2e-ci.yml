name: e2e-ci

# Milestone 2 P13 (MILESTONE_2_MASTER_PROMPT.md P13: "Playwright journeys ...
# the full assessment wizard for a user; each of the four roles landing on its
# dashboard with the correct sidebar; role-permission negative tests ...; and
# the profile/check-in flows" + visual regression via tools/vision/). Stands up
# the full stack (Postgres/Mongo/Redis + a real backend + a real built frontend)
# and runs a curated subset of web/tests/e2e/ against it — not the whole
# directory (that also covers onboarding, admin-panel, appearance-settings,
# etc., which are real regression value locally/manually but aren't what this
# phase's goal condition names as the CI-gating set).
#
# Visual regression (tools/vision/extract.py diff/strings) runs and uploads its
# output as an artifact but does NOT fail the job — docs/DECISIONS.md's P13 ADR
# explains why: the source PNGs are a fixed-content AI-generated marketing
# mockup (illustrative numbers, denser decorative layout) while these dashboards
# are real, live-data-driven pages (ADR-023/024) — a measured ~87% structural
# mismatch is a permanent, by-design gap between "real product" and "marketing
# mockup", not a regression a CI gate should block merges on. The `strings`
# check is genuinely useful signal (verbatim label/copy drift) and its output is
# still worth reading in the uploaded artifact even though it isn't a hard gate
# either, for the same "illustrative fixture numbers will never match real
# data" reason.

on:
  push:
    branches: [dev, main]
    paths: ["backend/**", "web/**", "tools/vision/**", ".github/workflows/e2e-ci.yml"]
  pull_request:
    branches: [dev, main]
    paths: ["backend/**", "web/**", "tools/vision/**", ".github/workflows/e2e-ci.yml"]

jobs:
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: skinlytics
          POSTGRES_PASSWORD: skinlytics
          POSTGRES_DB: skinlytics
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U skinlytics"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand(\"ping\")'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://skinlytics:skinlytics@localhost:5432/skinlytics
      MONGO_URI: mongodb://localhost:27017/skinlytics
      REDIS_URL: redis://localhost:6379/0
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_SECRET: ci-e2e-placeholder-not-a-real-secret
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:8000
      JWT_ISSUER: http://localhost:3000
      JWT_AUDIENCE: http://localhost:3000
      ENVIRONMENT: test

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.28"
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Set up Python
        run: uv python install
        working-directory: backend

      - name: Install backend dependencies
        run: uv sync --locked
        working-directory: backend

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: web

      # Better Auth's own tables (user/session/account/verification/jwks) —
      # database_schemas/skinlytics_identity_betterauth.md's documented command,
      # applied directly against the fresh Postgres service container. Must run
      # before Alembic: every domain table FKs to `user.id`.
      - name: Apply Better Auth schema
        run: npx @better-auth/cli migrate --yes
        working-directory: web

      - name: Run backend migrations
        run: uv run alembic upgrade head
        working-directory: backend

      - name: Seed placeholder product/ingredient catalog
        run: uv run python -m app.db.seed
        working-directory: backend

      - name: Start backend
        run: |
          uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health && break
            sleep 1
          done
          curl -sf http://localhost:8000/health
        working-directory: backend

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: web

      # Curated subset per this phase's goal condition — see the file header.
      - name: Run Playwright e2e subset
        run: |
          npx playwright test \
            tests/e2e/assessment-wizard.spec.ts \
            tests/e2e/admin-dashboard-p4.spec.ts \
            tests/e2e/clinical-dashboard-p5.spec.ts \
            tests/e2e/role-sidebar-labels.spec.ts \
            tests/e2e/role-permission-negatives.spec.ts \
            tests/e2e/user-journey.spec.ts
        working-directory: web

      - name: Install tools/vision dependencies
        if: always()
        run: |
          sudo apt-get update && sudo apt-get install -y tesseract-ocr libtesseract-dev
          uv pip install --system pillow pytesseract opencv-python-headless numpy scikit-learn

      # Report-only — never fails the job. See file header for why a hard
      # threshold against these specific source PNGs isn't a meaningful gate:
      # they're a fixed AI-mockup, permanently ~87% different from a real,
      # live-data page by design, not a regression.
      - name: Visual regression report vs. source mockup — informational only
        if: always()
        run: |
          set +e
          for pair in "User:user-dashboard" "Admin:admin-dashboard" "Consultant:consultant-dashboard" "Derma:dermatologist-dashboard"; do
            src="${pair%%:*}"; build="${pair##*:}"
            echo "=== $build ==="
            python3 tools/vision/extract.py diff "docs/milestones/milestone_2/${src}.png" "docs/milestones/milestone_2/build/${build}.png" --structural --max-pct 8 --out "docs/milestones/milestone_2/build/diff-${build}.png"
            python3 tools/vision/extract.py strings "docs/milestones/milestone_2/${src}.png" "docs/milestones/milestone_2/build/${build}.png"
          done
          exit 0

      # M2_RECOVERY_AND_REVIEW.md §5 item 4 — the mockup comparison above can never
      # gate a merge (permanent by-design mismatch), so it was the only visual check
      # and couldn't actually catch a real UI regression. This one diffs the fresh
      # build against docs/milestones/milestone_2/baseline/ — a same-shape
      # live-data screenshot committed after a deliberately-reviewed UI change — so
      # a normal PR should render identically (~0% structural diff) and a real
      # unintended regression trips the default 2% budget. No `set +e`/`exit 0`: a
      # failure here fails the job.
      #
      # To intentionally accept a UI change: run the three specs below locally
      # against `npm run build && npm run start`, then copy the resulting
      # docs/milestones/milestone_2/build/*-dashboard.png over the matching file in
      # baseline/ and commit them alongside the change.
      - name: Visual regression gate vs. baseline (build-to-build)
        run: |
          for build in user-dashboard admin-dashboard consultant-dashboard dermatologist-dashboard; do
            echo "=== $build ==="
            python3 tools/vision/extract.py diff "docs/milestones/milestone_2/baseline/${build}.png" "docs/milestones/milestone_2/build/${build}.png" --structural --max-pct 2
          done

      - name: Upload e2e artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            web/playwright-report/
            docs/milestones/milestone_2/build/*.png
          retention-days: 14

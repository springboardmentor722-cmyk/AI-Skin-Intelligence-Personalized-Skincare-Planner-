name: backend-ci

# Production-readiness audit finding: no CI/CD existed at all despite an
# extensive test suite (225 pytest tests, ruff, mypy --strict) that only ever
# ran manually/locally. Real Postgres/Redis/Mongo service containers, the exact
# same bootstrap sequence (`alembic upgrade head` + `python -m app.db.seed`)
# verified locally against a genuinely fresh database while fixing the missing
# scoring_weights/skin_types/skin_concerns seed data — that verification is
# what this workflow is built from, not a guess.

on:
  push:
    branches: [dev, main]
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]
  pull_request:
    branches: [dev, main]
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]

defaults:
  run:
    working-directory: backend

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: skinlytics
          POSTGRES_PASSWORD: skinlytics
          POSTGRES_DB: skinlytics
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U skinlytics"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand(\"ping\")'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://skinlytics:skinlytics@localhost:5432/skinlytics
      MONGO_URI: mongodb://localhost:27017/skinlytics
      REDIS_URL: redis://localhost:6379/0
      BETTER_AUTH_URL: http://localhost:3000
      ENVIRONMENT: test

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.28"
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked

      # Better Auth's own "user" table is normally created by
      # `npx @better-auth/cli generate` (web/lib/auth.ts) — Alembic's migrations
      # reference it via FK but don't own it (database_schemas/...sql's own
      # comment: "do NOT hand-edit"). CI has no reason to stand up the whole
      # Next.js/Better Auth toolchain just to create one table whose exact
      # columns are already pinned in that schema doc — created directly here,
      # matching that doc's literal DDL.
      - name: Create Better Auth's user table
        run: |
          PGPASSWORD=skinlytics psql -h localhost -U skinlytics -d skinlytics <<'SQL'
          CREATE TABLE "user" (
              id             TEXT PRIMARY KEY,
              name           TEXT,
              email          TEXT UNIQUE NOT NULL,
              "emailVerified" BOOLEAN DEFAULT FALSE,
              image          TEXT,
              role           TEXT DEFAULT 'user'
                  CHECK (role IN ('user','consultant','dermatologist','admin')),
              banned         BOOLEAN DEFAULT FALSE,
              "banReason"    TEXT,
              "banExpires"   TIMESTAMP,
              "createdAt"    TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
              "updatedAt"    TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
              "consentAcceptedAt"    TIMESTAMPTZ,
              "consentPolicyVersion" TEXT
          );
          SQL

      - name: Run migrations
        run: uv run alembic upgrade head

      - name: Seed placeholder product/ingredient catalog
        run: uv run python -m app.db.seed

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Type check (mypy --strict)
        run: uv run mypy --strict app/

      - name: Test (pytest)
        run: uv run pytest -q

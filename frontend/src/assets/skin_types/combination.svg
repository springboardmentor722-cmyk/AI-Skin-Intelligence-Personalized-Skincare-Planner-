<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" class="w-full h-full">
  <defs>
    <linearGradient id="comboBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0FDF4" />
      <stop offset="100%" stop-color="#DCFCE7" />
    </linearGradient>
    <linearGradient id="faceGradCombo" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFEDD5" />
      <stop offset="100%" stop-color="#FED7AA" />
    </linearGradient>
    <filter id="shadowCombo" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#10B981" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="200" height="200" rx="32" fill="url(#comboBg)" />
  <circle cx="100" cy="100" r="70" fill="#34D399" opacity="0.15" />

  <!-- Base Face -->
  <path d="M60 135 C60 165, 140 165, 140 135 C140 110, 145 90, 140 70 C135 45, 65 45, 60 70 C55 90, 60 110, 60 135 Z" fill="url(#faceGradCombo)" filter="url(#shadowCombo)"/>

  <!-- Glowing T-Zone Highlight (Oily Zone) -->
  <path d="M72 65 H128 V88 L108 108 V138 H92 V108 L72 88 Z" fill="#F59E0B" opacity="0.3" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="4 2"/>

  <!-- T-Zone Drops -->
  <circle cx="100" cy="72" r="3" fill="#D97706" />
  <circle cx="100" cy="115" r="2.5" fill="#D97706" />

  <!-- Dry Cheeks Contrast Indicators (Left & Right Cheeks) -->
  <!-- Left Cheek (Dry lines) -->
  <path d="M65 105 L76 108 M66 114 L75 116" stroke="#3B82F6" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Right Cheek (Dry lines) -->
  <path d="M135 105 L124 108 M134 114 L125 116" stroke="#3B82F6" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Balance Dual Icon (Split Indicator) -->
  <g transform="translate(142, 45)">
    <circle cx="12" cy="12" r="14" fill="#059669" opacity="0.2"/>
    <path d="M12 4 V20" stroke="#059669" stroke-width="2" stroke-dasharray="2 2"/>
    <circle cx="8" cy="12" r="2" fill="#F59E0B"/>
    <circle cx="16" cy="12" r="2" fill="#3B82F6"/>
  </g>
</svg>


services:

  # POSTGRESQL DATABASE

  postgres:
    image: postgres:18.4-alpine
    container_name: skincare_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: ai_skincare_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - skincare_network
    restart: unless-stopped


  # FASTAPI BACKEND

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: skincare_backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:admin123@postgres:5432/ai_skincare_db
      PYTHONUNBUFFERED: 1
      PYTHONDONTWRITEBYTECODE: 1
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./backend/uploads:/app/uploads
    networks:
      - skincare_network
    restart: unless-stopped
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload


  # REACT FRONTEND
 
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: skincare_frontend
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://localhost:8000/api
      NODE_ENV: development
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - skincare_network
    restart: unless-stopped


# NETWORKS

networks:
  skincare_network:
    driver: bridge


# VOLUMES

volumes:
  postgres_data:
    driver: local
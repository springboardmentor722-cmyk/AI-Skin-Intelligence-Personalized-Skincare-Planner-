version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: skingenie_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: skincare_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  mongodb:
    image: mongo:6.0
    container_name: skingenie_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db

  redis:
    image: redis:7-alpine
    container_name: skingenie_redis
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
    container_name: skingenie_backend
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/skincare_db
      - MONGO_URI=mongodb://mongodb:27017/skincare
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=skingenietempproductkeyformilestone3and4
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - mongodb
      - redis

  frontend:
    build:
      context: ./frontend
    container_name: skingenie_frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
  mongodata:

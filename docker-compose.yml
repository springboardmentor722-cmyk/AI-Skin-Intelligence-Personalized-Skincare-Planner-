# Skinlytics — local dev data stores.
# Vector DB in dev is FAISS (in-process, no container); Pinecone is prod-only.
# `make up` starts these; `make down` stops them.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: skinlytics
      POSTGRES_PASSWORD: skinlytics
      POSTGRES_DB: skinlytics
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      # DDL is applied via migrations (Alembic + Better Auth CLI), not auto-run here.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skinlytics"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes:
      - mongodata:/data/db

  redis:
    image: redis:7
    command: ["redis-server", "--maxmemory-policy", "volatile-lru"]   # see infra schema
    ports: ["6379:6379"]
    volumes:
      - redisdata:/data

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports: ["9200:9200"]
    volumes:
      - esdata:/usr/share/elasticsearch/data

  # S3-compatible object storage (.env.example's S3_* vars, docs/ARCHITECTURE.md §7) —
  # verification documents now; profile images/skin-scan images/progress photos reuse
  # the same bucket later. Credentials are dev-only, generated locally, not a
  # third-party account (unlike the still-blocked OpenWeather/Kaggle/email adapters).
  minio:
    image: minio/minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: skinlytics
      MINIO_ROOT_PASSWORD: skinlytics_dev_only
    ports: ["9000:9000", "9001:9001"]
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ADR-010 (M3-A) — polls the outbox, projects to Elasticsearch + FAISS, runs slow
  # jobs (arq, on the redis service above). Same image as api-to-be (backend/Dockerfile,
  # ADR-005: monolith until M4) — `api`/`web` compose entries stay deferred to M4.
  # In-cluster URLs (service names, not localhost) override the repo-root .env, which
  # is written for the host machine's own processes (uv run uvicorn, npm run dev).
  worker:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql://skinlytics:skinlytics@postgres:5432/skinlytics
      MONGO_URI: mongodb://mongo:27017/skinlytics
      REDIS_URL: redis://redis:6379/0
      ELASTICSEARCH_URL: http://elasticsearch:9200
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY_ID: skinlytics
      S3_SECRET_ACCESS_KEY: skinlytics_dev_only
      FAISS_INDEX_DIR: /data/faiss
      AI_IMPL_EMBEDDER: real
    volumes:
      # Bind mount (not a named volume) — deliberately the same repo-root ml/faiss/
      # host-run processes use (backend/.env's FAISS_INDEX_DIR=../ml/faiss, resolved
      # from backend/). A named volume would give the worker its own isolated FAISS
      # files a host-run API/pytest process could never see — found live, fixed
      # before it shipped: a product landed in ES from inside the container but never
      # in `ml/faiss/products.index` on the host.
      - ./ml/faiss:/data/faiss
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      elasticsearch:
        condition: service_started
      mongo:
        condition: service_started

volumes:
  pgdata:
  mongodata:
  redisdata:
  esdata:
  miniodata:

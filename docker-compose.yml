# Skinlytics — local dev data stores.
# Vector DB in dev is FAISS (in-process, no container); Pinecone is prod-only.
# `make up` starts these; `make down` stops them.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: skinlytics
      POSTGRES_PASSWORD: skinlytics
      POSTGRES_DB: skinlytics
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      # DDL is applied via migrations (Alembic + Better Auth CLI), not auto-run here.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skinlytics"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes:
      - mongodata:/data/db

  redis:
    image: redis:7
    command: ["redis-server", "--maxmemory-policy", "volatile-lru"]   # see infra schema
    ports: ["6379:6379"]
    volumes:
      - redisdata:/data

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports: ["9200:9200"]
    volumes:
      - esdata:/usr/share/elasticsearch/data

  # S3-compatible object storage (.env.example's S3_* vars, docs/ARCHITECTURE.md §7) —
  # verification documents now; profile images/skin-scan images/progress photos reuse
  # the same bucket later. Credentials are dev-only, generated locally, not a
  # third-party account (unlike the still-blocked OpenWeather/Kaggle/email adapters).
  minio:
    image: minio/minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: skinlytics
      MINIO_ROOT_PASSWORD: skinlytics_dev_only
    ports: ["9000:9000", "9001:9001"]
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  mongodata:
  redisdata:
  esdata:
  miniodata:
